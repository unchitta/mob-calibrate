[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobcalibrate"
version = "0.2.0"
description = "Calibration tools for mobile phone location data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "tqdm",
]

[project.optional-dependencies]
examples = [
    "scipy",
    "matplotlib",
    "seaborn",
    "fastparquet",
    "ipykernel",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
